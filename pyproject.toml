[project]
name = "bellwether"
version = "0.1.0"
description = "Floating status widget for Herdr agents"
requires-python = ">=3.12"
dependencies = [
    "pyside6-essentials==6.12.*",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
