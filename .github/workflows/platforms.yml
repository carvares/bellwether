# The proof of the other systems on real machines (see docs/superpowers/specs/2026-11-20-bellwether-cross-platform-design.md,
# "Proof"). The repository is private: a macOS minute counts 10 times and a Windows minute 2 times, so each job runs a
# selected fast test set, the smoke run, the self-test and the screen pictures, in a few minutes. A job runs only when
# it is asked for: by hand (the input `system`), or by a push to the branch of the port that changes code and whose
# head commit message has the marker `[ci macos]`, `[ci windows]` or `[ci both]` (no marker: no job).
name: platforms

on:
  workflow_dispatch:
    inputs:
      system:
        description: "The system to prove"
        type: choice
        options: [macos, windows, both]
        default: both
  push:
    branches: [cross-platform]
    paths:
      - "bellwether/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/platforms.yml"

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.system == 'macos' || inputs.system == 'both'))
      || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[ci macos]')
      || contains(github.event.head_commit.message, '[ci both]')))
    runs-on: macos-latest
    timeout-minutes: 6
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.14"

      - name: The runner
        run: |
          sw_vers
          uname -m
          sysctl -n hw.ncpu

      - name: Install
        run: |
          SECONDS=0; trap 'echo "wall time: ${SECONDS} s"' EXIT
          uv sync --locked
          uv pip list | grep -i -E "pyside6|pyobjc|psutil"

      - name: Selected tests
        run: |
          SECONDS=0; trap 'echo "wall time: ${SECONDS} s"' EXIT
          status=0
          # The platform package, the macOS module, the watcher, the client, the state, the sessions, the settings,
          # the start script, the events and the self-test in this process (no Qt window of a system).
          uv run --locked pytest -q -p no:cacheprovider --durations=10 \
            tests/test_platform.py tests/test_macos.py tests/test_guard.py tests/test_client.py \
            tests/test_client_screen.py tests/test_state.py tests/test_sessions.py tests/test_settings.py \
            tests/test_start_script.py tests/test_events.py tests/test_selftest.py tests/test_mainthread.py \
            tests/test_start_path.py tests/test_windows.py \
            -k "not the_command_prints_one_json_object" || status=1
          # The plain shell on the Qt of macOS (off screen): the cases marked `runner` (tests/conftest.py). All plain
          # cases take 5 minutes here, over the budget.
          uv run --locked pytest -q -p no:cacheprovider --durations=5 -m runner \
            tests/test_qml.py tests/test_skins.py tests/test_answer_control.py || status=1
          exit $status

      - name: Smoke run against a made-up Herdr
        if: always()
        run: |
          SECONDS=0; trap 'echo "wall time: ${SECONDS} s"' EXIT
          uv run --locked python scripts/ci/smoke.py ci-out/smoke 25

      - name: Self-test and pictures of the screen
        if: always()
        run: |
          SECONDS=0; trap 'echo "wall time: ${SECONDS} s"' EXIT
          uv run --locked python scripts/ci/selftest.py ci-out darwin

      - name: Upload the facts, the logs and the pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-run
          path: ci-out
          retention-days: 3
          if-no-files-found: warn

  windows:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.system == 'windows' || inputs.system == 'both'))
      || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[ci windows]')
      || contains(github.event.head_commit.message, '[ci both]')))
    runs-on: windows-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.14"

      - name: The runner
        run: |
          cmd //c ver
          echo "processors: $NUMBER_OF_PROCESSORS"
          powershell -NoProfile -Command "Add-Type -AssemblyName System.Windows.Forms; [System.Windows.Forms.Screen]::AllScreens | Format-List DeviceName, Bounds, WorkingArea, Primary"

      - name: Install
        run: |
          SECONDS=0; trap 'echo "wall time: ${SECONDS} s"' EXIT
          uv sync --locked
          uv pip list | grep -i -E "pyside6|psutil|pyobjc" || true

      - name: Selected tests
        run: |
          SECONDS=0; trap 'echo "wall time: ${SECONDS} s"' EXIT
          status=0
          # The platform package, the Windows module (its tests marked on_windows run here), the main-thread call,
          # the start path, the client (with the Linux and the Windows module), the state, the settings, the start
          # scripts, the events (real pipes through PeekNamedPipe) and the self-test in this process. Not here: the
          # watcher (POSIX signals; not used on Windows), the sessions (a made-up /proc with fifos and links), the
          # paths (XDG), the macOS module.
          uv run --locked pytest -q -p no:cacheprovider --durations=10 \
            tests/test_platform.py tests/test_windows.py tests/test_mainthread.py tests/test_start_path.py \
            tests/test_client.py tests/test_client_screen.py tests/test_state.py tests/test_settings.py \
            tests/test_start_script.py tests/test_events.py tests/test_selftest.py \
            -k "not the_command_prints_one_json_object" || status=1
          # The plain shell on the Qt of Windows (off screen): the cases marked `runner` (tests/conftest.py).
          uv run --locked pytest -q -p no:cacheprovider --durations=5 -m runner \
            tests/test_qml.py tests/test_skins.py tests/test_answer_control.py || status=1
          exit $status

      - name: Smoke run against a made-up Herdr
        if: always()
        run: |
          SECONDS=0; trap 'echo "wall time: ${SECONDS} s"' EXIT
          uv run --locked python scripts/ci/smoke.py ci-out/smoke 30

      - name: Self-test and pictures of the screen
        if: always()
        run: |
          SECONDS=0; trap 'echo "wall time: ${SECONDS} s"' EXIT
          uv run --locked python scripts/ci/selftest.py ci-out win32

      - name: Upload the facts, the logs and the pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-run
          path: ci-out
          retention-days: 3
          if-no-files-found: warn
