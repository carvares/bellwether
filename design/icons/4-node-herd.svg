<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Bellwether icon 4: node herd</title>
  <desc>A herd as a node graph: one hub with circuit traces to four agent nodes, one in each status colour.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2028"/>
      <stop offset="1" stop-color="#0c0f13"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="13" fill="url(#tile)"/>
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="12.25" fill="none" stroke="#3a444e" stroke-width="1.5"/>
  <!-- traces -->
  <g fill="none" stroke="#6f7c88" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 32H15"/>
    <path d="M26.5 27L40.5 13H43"/>
    <path d="M29 30H38L42 26H48"/>
    <path d="M29 34H38L42 38H48"/>
    <path d="M26.5 37L40.5 51H43"/>
  </g>
  <!-- hub -->
  <circle cx="22" cy="32" r="6.6" fill="#1c232b" stroke="#e3e9ee" stroke-width="2.5"/>
  <circle cx="22" cy="32" r="2.3" fill="#e3e9ee"/>
  <!-- agents -->
  <circle cx="46" cy="13" r="4.2" fill="#f28b82"/>
  <circle cx="51" cy="26" r="4.2" fill="#fdd663"/>
  <circle cx="51" cy="38" r="4.2" fill="#8ab4f8"/>
  <circle cx="46" cy="51" r="4.2" fill="#81c995"/>
</svg>
