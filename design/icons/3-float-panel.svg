<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>herdr-float icon 3: float panel</title>
  <desc>The widget itself: a small panel that floats above its hover lines, with one pip and one bar for each agent status.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2028"/>
      <stop offset="1" stop-color="#0c0f13"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="13" fill="url(#tile)"/>
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="12.25" fill="none" stroke="#3a444e" stroke-width="1.5"/>
  <!-- hover lines under the panel -->
  <path d="M21 53.5H43" stroke="#4a5661" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M27 57H37" stroke="#333c45" stroke-width="1.8" stroke-linecap="round"/>
  <!-- the panel -->
  <rect x="14" y="9" width="36" height="39" rx="7" fill="#1c232b" stroke="#e3e9ee" stroke-width="2.4"/>
  <!-- status pips -->
  <circle cx="22" cy="18" r="2.5" fill="#f28b82"/>
  <circle cx="22" cy="25" r="2.5" fill="#fdd663"/>
  <circle cx="22" cy="32" r="2.5" fill="#8ab4f8"/>
  <circle cx="22" cy="39" r="2.5" fill="#81c995"/>
  <!-- bars -->
  <g stroke="#8b97a3" stroke-width="2.4" stroke-linecap="round">
    <path d="M28 18H36"/>
    <path d="M28 25H40"/>
    <path d="M28 32H43"/>
    <path d="M28 39H38"/>
  </g>
</svg>
